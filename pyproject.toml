[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-stockfish-mcp"
version = "0.3.0"
description = "Low-latency remote chess MCP combining Stockfish, openings, Syzygy, and player history."
requires-python = ">=3.11"
dependencies = [
  "fastmcp==4.1.5",
  "python-chess==1.999",
  "google-cloud-firestore>=2.34,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
