name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  SERVICE: victor-stockfish-mcp
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy from source
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          RUNTIME_SA="chess-mcp-runtime@${PROJECT_ID}.iam.gserviceaccount.com"
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --cpu 2 \
            --cpu-boost \
            --memory 2Gi \
            --concurrency 1 \
            --timeout 30 \
            --min 0 \
            --max 3 \
            --set-env-vars "STOCKFISH_THREADS=2,STOCKFISH_HASH_MB=512,MAX_ANALYSIS_MS=15000,MAX_MULTIPV=8,MAX_DEPTH=40,MAX_NODES=50000000,HISTORY_BACKEND=firestore,HISTORY_WRITES_ENABLED=false,GCP_PROJECT_ID=${PROJECT_ID},CONTEXT_NETWORK_TIMEOUT_MS=1200"
